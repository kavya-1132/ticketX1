services:
  mongo:
    image: mongo:7.0
    container_name: ticketx-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'rs.status().ok' || mongosh --eval 'rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ticketx-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ticketx?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:-change-me-local-dev-only}
      - JWT_EXPIRES_IN=7d
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CLIENT_URL=http://localhost:5173
      - SEED_ON_START=true
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ticketx-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  mongo_data:
