# Render Blueprint: one free web service serving the API, Socket.IO and the built React app.
# MongoDB comes from a free MongoDB Atlas cluster (paste its connection string as MONGO_URI).
services:
  - type: web
    name: ticketx
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false # you are asked for this when creating the Blueprint
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_HOURS
        value: "24"
      # Optional: real emails via Mailtrap (port 2525 is allowed on Render's free tier)
      - key: SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
